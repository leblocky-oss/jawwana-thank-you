<style>
:root{
  --paper:#F6F5F4; --print-orange:#F1551A; --print-purple:#4B409A; --print-purple-d:#3B3485;
  --bg:#F7F7F7; --surface:#FFFFFF; --ink:#1E1E1E; --muted:#8B9199; --line:#E3E7EC;
  --purple:#4E4187; --orange:#E36414; --mint:#A2FAA3;
  --grad:linear-gradient(180deg,#F3F3F5 0%,#E2DEEA 22%,#C9C1DC 45%,#A79CC8 68%,#8C7FB8 85%,#7A6CA8 100%);
  --ease:cubic-bezier(.55,0,.25,1); --out:cubic-bezier(.2,.8,.2,1);
  --A5:1.4142;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;display:flex;justify-content:center;padding:16px;-webkit-font-smoothing:antialiased}
.ar{font-family:Almarai,system-ui,sans-serif;direction:rtl}

.stage{position:relative;width:100%;max-width:400px;height:760px;border:1px solid var(--line);border-radius:24px;overflow:hidden;
  background:radial-gradient(120% 70% at 50% 45%,#FFFFFF 0%,var(--paper) 70%,#EEEBF3 100%);box-shadow:0 1px 2px rgba(0,0,0,.04),0 20px 50px rgba(30,30,30,.08)}
#call{position:absolute;inset:0;display:flex;flex-direction:column;padding:30px 24px 26px}
#call > *{flex-shrink:0}
.fade{transition:opacity .45s ease}
.gone{opacity:0;pointer-events:none}

.top{display:flex;justify-content:center;color:var(--print-orange)}
.top .lg{height:28px;width:auto}
h1{margin-top:44px;text-align:center;font-weight:800}
h1 .ar{display:block;font-size:32px;line-height:1.3}
h1 .en{display:block;font-size:36px;line-height:1.1;letter-spacing:-.03em}
h1 .hl{color:var(--purple)}

/* ---- envelope (landscape take on the print) ---- */
.env-wrap{flex:1 1 auto!important;display:grid;place-items:center;padding-top:70px}
.env{position:relative;width:310px;height:228px;perspective:1300px;transition:transform .7s var(--out),opacity .5s ease;will-change:transform,opacity}
.env .back{position:absolute;inset:0;background:var(--paper);border-radius:12px;box-shadow:0 18px 36px rgba(30,30,30,.12),0 1px 0 #E6E3DF}
.env .inner{position:absolute;inset:0;border-radius:12px;overflow:hidden;opacity:0}
.env .inner .wm{position:absolute;right:-70px;top:-50px;width:250px;color:#ECEAE7}
.env .inner .wm svg{display:block;width:100%;height:auto}
.env .inner .line{position:absolute;left:0;right:0;top:20px;text-align:center;color:var(--print-purple)}
.env .inner .line .ar{display:block;font-size:12.5px;font-weight:700}
.env .inner .line .en{display:block;font-size:9.5px;font-weight:500;margin-top:3px}
.env .slot{position:absolute;left:0;right:0;bottom:0;top:-600px;overflow:hidden;pointer-events:none;z-index:2}

.env .pocket{position:absolute;left:0;right:0;bottom:0;height:118px;background:var(--paper);border-radius:4px 4px 12px 12px;z-index:3;
  box-shadow:0 -1px 0 #E7E4E0,0 -6px 14px rgba(30,30,30,.04);display:flex;align-items:flex-end;padding:0 22px 20px}
.env .pocket .fy{flex:1;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--print-purple);padding-bottom:4px;color:var(--print-purple);font-size:10px;font-weight:600}
.env .pocket .fy .ar{font-size:11px}
.env .front{position:absolute;inset:0;background:var(--paper);border-radius:12px;z-index:4;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:30px;color:var(--print-purple)}
.env .front .ar{font-size:12.5px;font-weight:700}
.env .front .en{font-size:9.5px;font-weight:500;margin-top:3px}
.env .flap{position:absolute;left:0;right:0;top:0;height:112px;transform-origin:top center;transform-style:preserve-3d;z-index:6;will-change:transform}
.env .flap .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px 12px 30px 30px;display:grid;place-items:center}
.env .flap .f{transform:translateZ(.1px);background:var(--paper);color:var(--print-purple);box-shadow:0 5px 12px rgba(30,30,30,.08);border-bottom:1px solid #ECEAE6}
/* inside of the flap: light at the outer edge, brand purple at ~55%, deep at the fold.
   This face is mirrored, so its top is the flap's outer edge once it's open. */
.env .flap .b{background:linear-gradient(180deg,#7466B8 0%,#4E4187 55%,#241D47 100%);color:#fff;transform:rotateX(180deg) translateZ(.1px);border-radius:30px 30px 12px 12px}
.env .flap .lg{width:62px;height:auto}
.env.anim .flap{transition:transform .55s var(--ease)}
.env.anim .front,.env.anim .inner{transition:opacity .3s ease}
.env.anim .cardin{transition:transform .5s var(--out)}
.env.pull .cardin{transition:transform 1.1s cubic-bezier(.45,0,.2,1)}

/* slider */
.slider{width:100%;height:60px;border-radius:999px;background:#fff;border:1px solid var(--line);position:relative;user-select:none;touch-action:none;overflow:hidden}
.slider .fill{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:999px;background:rgba(78,65,135,.10);opacity:0;transition:opacity .2s ease}
.slider.active .fill,.slider.done .fill{opacity:1}
.slider .knob::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--purple);opacity:0;pointer-events:none}
.slider .knob.pressed::after{animation:ring .6s ease-out}
@keyframes ring{from{opacity:.55;transform:scale(1)}to{opacity:0;transform:scale(1.7)}}
.slider .knob svg{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.slider.active .knob svg{transform:translateX(3px) scale(.9)}
.slider.active .knob{background:#5A4C99}
.slider .label{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted);pointer-events:none}
.slider .label .ar{display:inline;font-weight:700}
.slider .label .dot{color:#C9CDD3;margin:0 6px}
.slider .knob{position:absolute;top:5px;left:5px;width:48px;height:48px;border-radius:50%;background:var(--purple);display:grid;place-items:center;cursor:grab;outline:none;transition:background .25s}
.slider .knob:focus-visible{box-shadow:0 0 0 3px var(--mint)}
.slider .knob svg{width:20px;height:20px;position:relative}
.slider.done .knob{background:var(--orange);box-shadow:none}
.slider.snap .knob,.slider.snap .fill{transition:transform .35s var(--out),width .35s,background .25s}

/* ---- the A5 card once it's out ---- */
#a5{position:absolute;z-index:30;perspective:1600px;transform-origin:0 0;will-change:transform}
#a5.moving{transition:transform 1s var(--ease)}
#a5.off{visibility:hidden;pointer-events:none}
#a5 .hov{position:absolute;inset:0;transform-style:preserve-3d}
@keyframes hover{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-.6deg)}}
#a5 .flip{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
/* 3D turn: the card lifts toward you, tilts, turns, overshoots a touch and settles */
#a5.flipped .flip{animation:flip3d 1.35s cubic-bezier(.45,.05,.25,1) forwards}
@keyframes flip3d{
  0%  {transform:translateZ(0)    rotateY(0deg)   rotateX(0deg)}
  22% {transform:translateZ(70px) rotateY(28deg)  rotateX(9deg)}
  55% {transform:translateZ(95px) rotateY(120deg) rotateX(7deg)}
  82% {transform:translateZ(18px) rotateY(192deg) rotateX(-2deg)}
  100%{transform:translateZ(0)    rotateY(180deg) rotateX(0deg)}
}
/* shadow on the "table": tightens and fades as the card lifts, returns as it lands */
#a5 .shd{position:absolute;left:10%;right:10%;bottom:-26px;height:40px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(59,52,133,.32),rgba(59,52,133,.12) 60%,transparent);pointer-events:none;will-change:transform,opacity}
#a5.flipped .shd{animation:shd 1.35s cubic-bezier(.45,.05,.25,1) forwards}
@keyframes shd{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72) translateY(14px);opacity:.45}}
#a5 .s{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px}
#a5 .lift{position:absolute;inset:0;border-radius:6px;box-shadow:0 24px 50px rgba(59,52,133,.28),0 4px 12px rgba(30,30,30,.10)}
#a5.flipped .lift{animation:liftfade 1.35s ease forwards}
@keyframes liftfade{0%,100%{opacity:1}30%,70%{opacity:0}}

/* the front: laid out on a fixed A5 canvas (420 × 594) and scaled to fit, like the print */
.canvas{position:absolute;left:0;top:0;width:420px;height:594px;transform-origin:top left;padding:24px 30px 20px;overflow:hidden}
.canvas .art{position:absolute;left:0;top:0;width:420px;height:594px;pointer-events:none}
.canvas > *:not(.art){position:relative}
.hd{text-align:center}
.hd .ar-l{font-family:Almarai,system-ui,sans-serif;font-weight:800;font-size:22px;line-height:1.3;direction:rtl}
.hd .en-l{font-weight:700;font-size:23px;line-height:1.15;letter-spacing:-.02em}
.hd .p{color:var(--purple)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:13px;align-items:start}
.cols .en{font-size:10.5px;line-height:1.45;font-weight:500;text-align:left}
.cols .ar{font-size:11.5px;line-height:1.6;text-align:right}
.cols.so{margin-top:12px}
.cols.so .en,.cols.so .ar{font-weight:800;font-size:19px;line-height:1.2;text-align:center}
.cols.tight{margin-top:6px}
.hd.stays{margin-top:15px}
.hd.stays .ar-l{font-size:17px}.hd.stays .en-l{font-size:17px}
.perks{list-style:none;margin-top:10px;display:grid;gap:6px}
.perks li{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.perks li > div{display:flex;gap:8px;align-items:center}
.perks .num{font-family:Montserrat,system-ui,sans-serif;font-weight:300;font-size:36px;line-height:.9;color:transparent;-webkit-text-stroke:1.1px #fff;min-width:22px;text-align:center;flex:none}
.perks .ar .num{font-family:Almarai,system-ui,sans-serif}
.perks .en span{font-size:10px;line-height:1.35;font-weight:500}
.perks .ar span{font-size:11px;line-height:1.5}

.after{position:absolute;left:0;right:0;bottom:16px;text-align:center;z-index:31;opacity:0;transition:opacity .5s ease;pointer-events:none}
.socials{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:10px}
.socials .lbl{font-size:12px;font-weight:600;color:var(--print-purple)}
.socials .lbl .dot{color:#C9CDD3}
.socials .icons{display:flex;gap:12px}
.socials a{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--print-purple);color:#fff;transition:transform .2s ease,background .2s ease}
.socials a:active{transform:scale(.92)}
.socials a:hover{background:#5D509A}
.socials a svg{width:20px;height:20px}
.after.on{opacity:1;pointer-events:auto}
.after button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer}
.after .ar{display:inline}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const $ = s => document.querySelector(s);

/* Socials: add a URL when an account goes live and its button appears automatically. Empty = hidden. */
const SOCIALS = [
  { name:"Instagram", url:"https://www.instagram.com/jawwana.sa/",
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/></svg>' },
  { name:"TikTok", url:"",
    icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 3c.4 2.2 1.8 3.7 4 4v3.1c-1.5 0-2.9-.4-4-1.2v6.3a5.8 5.8 0 1 1-5.8-5.8c.3 0 .6 0 .9.1v3.2a2.7 2.7 0 1 0 1.8 2.5V3h3.1z"/></svg>' },
  { name:"LinkedIn", url:"",
    icon:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.5 9h3v11h-3zM6 3.8a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6zM10 9h2.9v1.5c.4-.8 1.5-1.7 3.1-1.7 3.3 0 3.9 2.1 3.9 4.9V20h-3v-5.5c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9V20H10z"/></svg>' },
];
document.getElementById("socials").innerHTML = SOCIALS.filter(s => s.url)
  .map(s => `<a href="${s.url}" target="_blank" rel="noopener" aria-label="Jawwana on ${s.name}">${s.icon}</a>`).join("");
const stage = $("#stage"), env = $("#env"), flap = $(".env .flap"), front = $(".env .front"), inner = $(".env .inner"), cardin = $("#cardin");
const slider = $("#slider"), knob = slider.querySelector(".knob"), fill = slider.querySelector(".fill");
const a5 = $("#a5"), after = $("#after");
const A5 = 1.4142, AUTO = 0.78;
let dragging = false, startX = 0, x = 0, opened = false, timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const clamp = v => Math.max(0, Math.min(1, v));
const maxX = () => slider.clientWidth - knob.offsetWidth - 10;

/* the slider scrubs the opening */
function setProgress(p){
  const f = clamp(p / 0.6);
  flap.style.transform = `rotateX(${180 * f}deg)`;
  flap.style.zIndex = f > 0.5 ? 1 : 6;
  const o = clamp((p - 0.22) / 0.25);
  front.style.opacity = 1 - o; inner.style.opacity = o;
  cardin.style.transform = `translateY(${-62 * clamp((p - 0.5) / 0.5)}px)`;   // the card peeks
}
function setKnob(v){
  x = Math.max(0, Math.min(v, maxX()));
  knob.style.transform = `translateX(${x}px)`;
  fill.style.width = x > 0 ? (x + knob.offsetWidth + 10) + "px" : "0";
  setProgress(x / maxX());
}
knob.addEventListener("pointerdown", e => {
  if (opened) return;
  dragging = true; startX = e.clientX - x; slider.classList.remove("snap"); env.classList.remove("anim");
  slider.classList.add("active");
  knob.classList.remove("pressed"); void knob.offsetWidth; knob.classList.add("pressed");
  knob.setPointerCapture(e.pointerId); knob.style.cursor = "grabbing";
});
knob.addEventListener("pointermove", e => {
  if (!dragging) return;
  setKnob(e.clientX - startX);
  if (x / maxX() >= AUTO){ dragging = false; slider.classList.remove("active"); complete(); }
});
function release(){
  if (!dragging) return; dragging = false; knob.style.cursor = "grab"; slider.classList.remove("active");
  if (x / maxX() >= AUTO) complete();
  else { slider.classList.add("snap"); env.classList.add("anim"); setKnob(0); fill.style.width = "0"; }
}
knob.addEventListener("pointerup", release);
knob.addEventListener("pointercancel", release);
knob.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); complete(); } });

/* where the A5 card ends up: as big as the stage allows, centred */
function a5Rect(){
  const W = stage.clientWidth, H = stage.clientHeight;
  const w = Math.min(W - 36, (H - 165) / A5), h = w * A5;
  return { left:(W - w) / 2, top:(H - h) / 2 - 52, width:w, height:h };
}
function place(el, r){ Object.assign(el.style, {left:r.left+"px", top:r.top+"px", width:r.width+"px", height:r.height+"px"}); }

function complete(){
  if (opened) return; opened = true;
  slider.classList.add("snap","done"); env.classList.add("anim"); setKnob(maxX());
  knob.blur();
  try { navigator.vibrate && navigator.vibrate(20); } catch(_){}
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){ showFinal(); return; }

  // 1) the card slides all the way out of the pocket
  later(() => {
    document.querySelectorAll("#call .fade").forEach(el => el.classList.add("gone"));
    env.classList.add("pull");
    cardin.style.transform = `translateY(-${cardin.offsetHeight + 10}px)`;
  }, 600);

  // 2) hand over to the free-floating card at the exact same spot, then bring it to the middle at A5 size
  later(() => {
    const s = stage.getBoundingClientRect(), l = cardin.getBoundingClientRect();
    const fin = a5Rect();
    place(a5, fin);
    a5.classList.remove("flipped","hover","moving"); a5.classList.remove("off");
    a5.style.transform = `translate(${l.left - s.left - fin.left}px, ${l.top - s.top - fin.top}px) scale(${l.width / fin.width})`;
    void a5.offsetWidth;
    cardin.style.visibility = "hidden";
    env.style.opacity = 0; env.style.transform = "translateY(40px)";
    a5.classList.add("moving");
    a5.style.transform = "none";
  }, 1800);

  // 3) it hovers there, back side up
  later(() => a5.classList.add("hover"), 2800);

  // 4) then turns over to the front
  later(() => { a5.classList.add("flipped"); }, 4000);
  later(() => after.classList.add("on"), 5500);
}
function showFinal(){
  document.querySelectorAll("#call .fade").forEach(el => el.classList.add("gone"));
  env.style.opacity = 0; a5.classList.remove("off"); a5.style.transform = "none"; place(a5, a5Rect()); a5.classList.add("flipped"); after.classList.add("on");
}
window.addEventListener("resize", () => { if (!a5.classList.contains("off")){ a5.classList.remove("moving"); a5.style.transform = "none"; place(a5, a5Rect()); } });

function replay(){
  timers.forEach(clearTimeout); timers = [];
  a5.classList.add("off"); a5.classList.remove("flipped","hover"); after.classList.remove("on");
  document.querySelectorAll("#call .fade").forEach(el => el.classList.remove("gone"));
  env.classList.remove("anim","pull"); env.style.opacity = ""; env.style.transform = "";
  cardin.style.visibility = ""; opened = false;
  slider.classList.remove("snap","done"); setKnob(0); fill.style.width = "0";
}
$("#replay").addEventListener("click", replay);
setKnob(0);
